[custom]
enable_rule_generator=true
overwrite_original_rules=true

; chain = name`front`landing[`front_type]
;   front: "[]GroupName" reference, or a node-remark regex (generates "<name>-front")
;   landing: node tag/regex, must resolve to exactly one node (your VPS)
chain=JP-Chain`(JP|日本)`my-jp-vps

; multi-node landing: reference a policy group (a set of VPS) with "[]GroupName"
custom_proxy_group=usa-landing`url-test`(LD-US)`http://www.gstatic.com/generate_204`300,5
chain=US-Chain`(JP|日本)`[]usa-landing

; route domains to the chain via the normal ruleset mechanism (policy name == chain name)
ruleset=JP-Chain,[]DOMAIN-SUFFIX,google.com
ruleset=US-Chain,[]DOMAIN-SUFFIX,openai.com
ruleset=DIRECT,[]GEOIP,CN
ruleset=JP-Chain,[]FINAL
