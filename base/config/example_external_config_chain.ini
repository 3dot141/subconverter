[custom]
; ===========================================================================
; Chain proxy override example
; ---------------------------------------------------------------------------
; Define named relay chains ONCE; subconverter derives the right config for
; both Clash (relay proxy-group) and Quantumult X (via-interface=%TUN% + ip-cidr/host backhaul).
;
; chain = name ` front ` landing [ ` front_type ]
;   front:      "[]GroupName" to reference an existing policy/proxy group,
;               OR a node-remark regex (auto-generates a "<name>-front" helper group)
;   landing:    node tag or regex; MUST resolve to exactly one node (your own VPS landing)
;   front_type: optional, used only when front is a regex; "select" (default) or "url-test"
;
; The landing node must be in the node pool: either present in the subscription,
; or appended as a node share-link in the `url=` query (e.g. url=<sub>|ss://...#my-jp-vps).
; ===========================================================================

enable_rule_generator=true
overwrite_original_rules=true

; front references an existing group "🇯🇵 节点"; landing is the VPS node "my-jp-vps"
chain=JP-Chain`[]🇯🇵 节点`my-jp-vps

; front is a regex -> generates helper group "US-Chain-front" of url-test type
chain=US-Chain`(美国|US)`my-us-vps`url-test

; Route domains to a chain by pointing a ruleset at the chain name (policy == chain name).
ruleset=JP-Chain,[]DOMAIN-SUFFIX,google.com
ruleset=US-Chain,[]DOMAIN-SUFFIX,openai.com
